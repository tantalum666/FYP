title = "FYP upload checks"

[extend]
useDefault = true

# Narrow exceptions verified against original source, including archived copies.
# No provider-secret rule is disabled and whole QA directories remain scanned.
[[allowlists]]
description = "Public UserDefaults route storage identifier; not an access token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|[!/])desk-companion/frontend/ios/App/App/(?:AppDelegate|DeskIntents)\.swift$''']
regexTarget = "match"
regexes = ['''^forKey:\s*"desk\.pending\.route\.v1"\s*$''']

[[allowlists]]
description = "Public Figma design file ID recorded as provenance"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|[!/])(?:output/brand/[^!]+/manifest\.json|Senplate_[^/]+/manifest\.json|output/qa/[^/]+/finalize_assets\.py)$''']
regexTarget = "match"
regexes = ['''^file_key["']\s*:\s*["']UyYjnTFGWO0r1lj4uvghGp["']\s*$''']

[[allowlists]]
description = "SHA256 file-integrity values in historical protection manifests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)output/qa/[^/]+/protected-(?:before|after)\.json$''', '''(?:^|/)output/qa/task-enhancement-ux-2026-10-03/validation\.json$''']
regexTarget = "match"
regexes = ['''^[A-Za-z0-9_.\-/]+["']\s*:\s*["'][a-f0-9]{64}["']\s*$''']

[[allowlists]]
description = "Verified public rig_local source SHA256; filename contains cloud_api"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^output/qa/2026-10-05-rig-arm-feasibility/research-checkpoint\.json$''', '''^research/2026-10-05-rig-arm/source-register\.json$''']
regexTarget = "match"
regexes = ['''^cloud_api_protocol\.cc["']\s*:\s*["']1a0fb0cbc28a26f17a3af764f156a5d8895fd2101c98711b5ea68275103d5b1a["']\s*$''']
