<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title desc">
<title id="title">三牌 L 形测量示意图</title><desc id="desc">ID 0 放左近侧，ID 1 放右近侧，ID 2 放右远侧。量 ID 0 到 ID 1 的左右中心间距 A，以及 ID 1 到 ID 2 的前后中心间距 B，单位厘米。ID 4 在中间移动。</desc>
<defs><marker id="arrowA" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#af692e" stroke-width="1.4"/></marker><marker id="arrowB" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="none" stroke="#277c99" stroke-width="1.4"/></marker></defs>
<rect width="600" height="350" rx="12" fill="#f2f8f6"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#345a59">
<text x="285" y="24" font-size="14">远侧 ↑　三张牌的上边都朝这里</text>
<rect x="85" y="75" width="395" height="175" fill="#e4f0eb" stroke="#a6c9bc" stroke-dasharray="5 5"/>
<path d="M85 250H480V75" fill="none" stroke="#298274" stroke-width="5"/>
<path d="M105 270V315M460 270V315" stroke="#d3b595" stroke-dasharray="3 3"/>
<path d="M85 278V320M480 278V320" stroke="#c9b497" stroke-dasharray="3 3"/>
<path d="M85 309H480" stroke="#af692e" stroke-width="2" marker-start="url(#arrowA)" marker-end="url(#arrowA)"/>
<text x="282" y="334" fill="#995722" font-size="15">A：ID 0 到 ID 1 的左右间距</text>
<path d="M508 75H551M508 250H551" stroke="#a5c4d2" stroke-dasharray="3 3"/>
<path d="M540 75V250" stroke="#277c99" stroke-width="2" marker-start="url(#arrowB)" marker-end="url(#arrowB)"/>
<text x="565" y="170" fill="#277c99" font-size="19" font-weight="600">B</text>
<g fill="#fff" stroke="#298274" stroke-width="2"><rect x="57" y="222" width="56" height="56" rx="6"/><rect x="452" y="222" width="56" height="56" rx="6"/><rect x="452" y="47" width="56" height="56" rx="6"/></g>
<g fill="#267d70"><circle cx="85" cy="250" r="4"/><circle cx="480" cy="250" r="4"/><circle cx="480" cy="75" r="4"/></g>
<g font-size="12" fill="#254e48"><text x="85" y="270">ID 0</text><text x="480" y="270">ID 1</text><text x="480" y="95">ID 2</text></g>
<g font-size="15" fill="#267d70"><text x="85" y="241">↑</text><text x="480" y="241">↑</text><text x="480" y="66">↑</text></g>
<path d="M190 210Q265 110 360 190" fill="none" stroke="#a6bcb6" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="290" cy="165" r="21" fill="#fff" stroke="#78968c"/><text x="290" y="170" font-size="12">ID 4</text>
<text x="280" y="220" font-size="13">移动目标放这里</text>
<text x="290" y="288" font-size="11" fill="#708d85">靠近你的一侧 · 蓝点代表黑框中心</text>
</g></svg>
