[project]
name = "desk-companion"
version = "0.1.0"
description = "Group 2 local calendar and desk companion"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-dateutil>=2.9,<4",
    "pwdlib[argon2]>=0.2,<1",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "icalendar>=6,<8",
    "recurring-ical-events>=3,<4",
    "cryptography>=45,<50",
    "python-socks[asyncio]>=2.8,<3",
]

[project.optional-dependencies]
vision = [
    "mediapipe==0.10.35; sys_platform == 'darwin'",
    "mediapipe==1.0.1; sys_platform == 'linux'",
]
audio = [
    "sentencepiece>=0.2,<1",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
