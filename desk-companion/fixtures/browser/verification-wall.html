<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Site verification</title>
  </head>
  <body>
    <h1>Site verification</h1>
    <p>Slide to verify you are human. This local rehearsal is not a merchant login.</p>
    <label>Password <input type="password" name="password" autocomplete="current-password" /></label>
    <label>SMS code <input name="otp" autocomplete="one-time-code" inputmode="numeric" /></label>
    <p>Confirm payment only after the check. No card is stored here.</p>
  </body>
</html>
