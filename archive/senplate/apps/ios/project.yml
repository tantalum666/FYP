name: Senplate
options:
  bundleIdPrefix: com.group2
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: '-'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Senplate:
    type: application
    platform: iOS
    sources:
      - path: Senplate/Sources
      - path: Senplate/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.group2.senplate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Senplate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Senplate/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleURLTypes:
          - CFBundleURLName: com.group2.senplate.menu
            CFBundleURLSchemes: [senplate]
        NSCameraUsageDescription: Scan menu and meal pairing codes in Senplate.
        UIAppFonts: [Manrope.ttf, NotoSansSC.ttf]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
  SenplateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SenplateUITests]
    dependencies:
      - target: Senplate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.group2.senplate.uitests
        TEST_TARGET_NAME: Senplate
schemes:
  Senplate:
    build:
      targets:
        Senplate: all
    run:
      config: Debug
    test:
      targets: [SenplateUITests]
      gatherCoverageData: false
