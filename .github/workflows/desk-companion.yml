name: Desk Companion
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'desk-companion/**'
      - '.github/workflows/desk-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DESK_VOICE_PROVIDER: none
  DESK_TEXT_PROVIDER: none
  DESK_TEXT_BACKGROUND: '0'
  DESK_COMPUTER_ENABLED: '0'
  DESK_LINUX_DESKTOP_ENABLED: '0'
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desk-companion
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.18'
          python-version: '3.14.5'
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check backend scripts tests
      - run: uv run --no-sync pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desk-companion/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: desk-companion/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
