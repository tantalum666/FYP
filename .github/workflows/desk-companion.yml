name: Desk Companion

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: desk-companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: desk-companion/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desk-companion/frontend/package-lock.json
      - name: Install Python dependencies
        working-directory: desk-companion
        run: uv sync --frozen
      - name: Ruff
        working-directory: desk-companion
        run: uv run --no-sync ruff check backend scripts tests
      - name: Backend tests
        working-directory: desk-companion
        run: uv run --no-sync pytest -q
      - name: Install frontend dependencies
        working-directory: desk-companion/frontend
        run: npm ci
      - name: Frontend tests
        working-directory: desk-companion/frontend
        run: npm test
      - name: Frontend typecheck and build
        working-directory: desk-companion/frontend
        run: npm run build
